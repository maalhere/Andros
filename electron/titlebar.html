<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Andros</title>
<style>
  :root { --bg: transparent; --text: #EDEDEF; --muted: #8B8D94; --border: transparent; --h: 36px; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body {
    color: var(--text);
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    user-select: none;
    transition: background-color .2s ease, color .2s ease;
  }
  .bar {
    position: relative;
    box-sizing: border-box;
    height: var(--h);
    display: flex;
    align-items: center;
    gap: 9px;
    /* El hueco de la derecha es para los botones nativos de Windows. */
    padding: 0 150px 0 12px;
    border-bottom: 1px solid var(--border);
    -webkit-app-region: drag;
  }
  img { width: 18px; height: 18px; border-radius: 5px; flex: none; }
  .brand { font-size: 12.5px; font-weight: 600; letter-spacing: .01em; flex: none; }
  .title { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .title:empty { display: none; }
  .title::before { content: "·"; margin-right: 9px; }
  .progress {
    position: absolute; left: 0; bottom: -1px; height: 2px; width: 30%;
    background: var(--muted); opacity: 0; border-radius: 2px;
    transition: opacity .2s ease;
  }
  .loading .progress { opacity: .7; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
</style>
</head>
<body>
<div class="bar" id="bar">
  <img src="../public/icons/icon-192.png" alt="">
  <span class="brand">Andros</span>
  <span class="title" id="title"></span>
  <span class="progress"></span>
</div>
<script>
  // El proceso principal llama a update() con el tema, el título y si carga.
  window.androsTitlebar = {
    update: function (state) {
      var root = document.documentElement.style;
      root.setProperty("--bg", state.colors.background);
      root.setProperty("--text", state.colors.text);
      root.setProperty("--muted", state.colors.muted);
      root.setProperty("--border", state.colors.border);
      root.setProperty("--h", state.height + "px");
      var title = (state.title || "").replace(/^Andros\s*[—–|·-]?\s*/i, "");
      document.getElementById("title").textContent = title;
      document.getElementById("bar").classList.toggle("loading", !!state.loading);
    }
  };
</script>
</body>
</html>
